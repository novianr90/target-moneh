<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Vibrant Emerald Target Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#334155" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Outer Target Ring (Dotted/Segmented) -->
  <circle cx="256" cy="256" r="170" stroke="url(#emerald-grad)" stroke-width="24" stroke-dasharray="80 30" stroke-linecap="round" filter="url(#emerald-glow)"/>

  <!-- Middle Precision Ring -->
  <circle cx="256" cy="256" r="110" stroke="url(#cyan-grad)" stroke-width="12" stroke-opacity="0.8"/>

  <!-- Crosshair Guides -->
  <line x1="256" y1="56" x2="256" y2="116" stroke="url(#emerald-grad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="396" x2="256" y2="456" stroke="url(#emerald-grad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="116" y2="256" stroke="url(#emerald-grad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="396" y1="256" x2="456" y2="256" stroke="url(#emerald-grad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Bullseye Center (Target Moneh Core) -->
  <circle cx="256" cy="256" r="54" fill="url(#emerald-grad)"/>

  <!-- Central Money/Goal Star Symbol -->
  <path d="M256 220L266 246L292 256L266 266L256 292L246 266L220 256L246 246Z" fill="#ffffff"/>
</svg>
